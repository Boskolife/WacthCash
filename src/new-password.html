<!doctype html>
<html lang="en">

{{> head-new-password }}

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    {{> header }}
    <main class="main" id="main-content">
        <section class="password-page">
            <div class="container">
                <div class="password-page__inner">
                    <h1 class="password-page__title">Set a new password</h1>
                    <p class="password-page__description">Create a new password. Ensure it differs
                        from previous ones for security.</p>
                    <form action="#" class="password-page__form sell__form" novalidate>
                        <label for="new-password-form-password">Create new password
                            <input type="password" id="new-password-form-password" name="new-password-form-password"
                                autocomplete="new-password" minlength="8" placeholder="min 8 characters" required>
                            <span class="form-error" aria-live="polite"></span>
                        </label>
                        <button type="submit" class="password-page__button btn btn_primary">Update
                            Password</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    {{> contact-modal }}
    {{> mobile-menu }}
    {{> footer }}
    <script type="module" src="/js/main.js"></script>
</body>

</html>
