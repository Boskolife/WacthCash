<div class="forgot-password-popup" role="dialog" aria-modal="true"
    aria-labelledby="forgot-password-popup-title" aria-hidden="true">
    <div class="forgot-password-popup__overlay"></div>
    <div class="forgot-password-popup__inner">
        <button class="forgot-password-popup__close" type="button" aria-label="Close popup">
            <img src="/icons/cross.svg" alt="" width="24" height="24" aria-hidden="true">
        </button>
        <div class="forgot-password-popup__content">
            <h2 class="forgot-password-popup__title" id="forgot-password-popup-title">Link Sent Successfully</h2>
            <p class="forgot-password-popup__description top">We’ve sent a password reset link to <span
                    id="forgot-password-popup-email" class="forgot-password-popup__email"></span>. <br>
                Please check your inbox and follow the instructions.</p>
            <p class="forgot-password-popup__description bottom">Didn’t receive the email? <a href="#" class="forgot-password-popup__link">Resend Link</a></p>
        </div>
    </div>
</div>
