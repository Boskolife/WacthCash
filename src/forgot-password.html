<!doctype html>
<html lang="en">

{{> head-forgot-password }}

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    {{> header }}
    <main class="main" id="main-content">
        <section class="section-forgot-password">
            <div class="container">
                <div class="section-forgot-password__inner">
                    <h1 class="section-forgot-password__title">Forgot Password</h1>
                    <p class="section-forgot-password__description">Enter the email address associated with your account, 
                        and we’ll send you a link to reset your password.</p>
                    <form action="#" class="section-forgot-password__form sell__form" novalidate>
                        <label for="forgot-password-form-email">Email
                            <input type="email" id="forgot-password-form-email" name="forgot-password-form-email" placeholder="Enter your email" required>
                            <span class="form-error" aria-live="polite"></span>
                        </label>
                        <button type="submit" class="section-forgot-password__button btn btn_primary">Send Reset Link</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    {{> contact-modal }}
    {{> mobile-menu }}
    {{> footer }}
    <script type="module" src="/js/main.js"></script>
</body>

</html>
