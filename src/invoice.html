<!doctype html>
<html lang="en">

{{> head-invoice }}

                <div class="invoice-page__inner">

                    <a href="#" class="invoice-page__button btn btn_primary">Back to Payment</a>

            </div>
        </section>
    </main>
    {{> contact-modal }}
    {{> mobile-menu }}
    {{> footer }}
    <script type="module" src="/js/main.js"></script>
</body>

</html>
